[project]
name = "nngtn-data"
version = "0.1.0"
description = "The paper's neural Gaussian tensor-network wave functions, their chains and measurements, and the scripts that reproduce its numbers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the package of this repository, ../code
    "nngtn",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
# The code repository's pins (its pyproject.toml): every library at the version the paper's runs used.
constraint-dependencies = [
    "colorama==0.4.6",
    "equinox==0.13.4",
    "fermix==0.1.0",
    "jax==0.11.2",
    "jax-cuda12-pjrt==0.11.2",
    "jax-cuda12-plugin==0.11.2",
    "jaxlib==0.11.2",
    "jaxtyping==0.3.11",
    "lineax==0.1.0",
    "lrux==0.2.0",
    "ml-dtypes==0.6.0",
    "numpy==2.3.5",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvcc-cu12==12.9.86",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-nccl-cu12==2.30.3",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "opt-einsum==3.4.0",
    "scipy==1.17.0",
    "typing-extensions==4.16.0",
    "wadler-lindig==0.1.7",
]

[tool.uv.sources]
nngtn = { path = "../code", editable = true }
